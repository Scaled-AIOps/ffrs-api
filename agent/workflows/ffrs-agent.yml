# Copy to <tracker repo>/.github/workflows/ffrs-agent.yml
name: FFRS agent
on:
  schedule: [{ cron: '*/30 * * * *' }]
  workflow_dispatch:
    inputs: { max_items: { description: 'Max issues per run', default: '3' } }
  issue_comment: { types: [created] }
permissions: { issues: write, contents: read }
concurrency: { group: ffrs-agent, cancel-in-progress: false }
env:
  TRACKER_REPO: ${{ github.repository }}
  TARGET_REPO: Scaled-AIOps/scaledaiops.org
  TARGET_DIR: target
jobs:
  agent:
    if: >-
      github.event_name != 'issue_comment' ||
      (contains(github.event.comment.body, '/confirm') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) && contains(join(github.event.issue.labels.*.name, ','), 'agent:proposal')) ||
      contains(github.event.comment.body, '/accept') || contains(github.event.comment.body, '/reject')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Handle /accept and /reject
        if: github.event_name == 'issue_comment' && !contains(github.event.comment.body, '/confirm')
        env: { GH_TOKEN: ${{ github.token }} }
        run: |
          set -euo pipefail
          B="${{ github.event.comment.body }}"
          case "$B" in *"/accept"*) gh issue edit ${{ github.event.issue.number }} --repo "$TRACKER_REPO" --add-label requester:accepted;; esac
          case "$B" in *"/reject"*) gh issue edit ${{ github.event.issue.number }} --repo "$TRACKER_REPO" --add-label agent:rejected --remove-label agent:proposal;; esac
          echo "handled=1" >> "$GITHUB_ENV"
      - if: env.handled != '1'
        uses: actions/checkout@v4
        with: { repository: Scaled-AIOps/ffrs-api, path: ffrs-api }
      - if: env.handled != '1'
        uses: actions/checkout@v4
        with: { repository: ${{ env.TARGET_REPO }}, path: target, token: ${{ secrets.FFRS_AGENT_TOKEN }}, fetch-depth: 0 }
      - if: env.handled != '1'
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: env.handled != '1'
        run: |
          npm i -g @anthropic-ai/claude-code
          cd target && npm ci && npx playwright install --with-deps chromium
      - if: env.handled != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          FFRS_AGENT_TOKEN: ${{ secrets.FFRS_AGENT_TOKEN }}
          MODE: ${{ github.event_name == 'issue_comment' && 'execute' || 'respond' }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MAX_ITEMS: ${{ github.event.inputs.max_items || '3' }}
        run: node ffrs-api/agent/run.mjs
